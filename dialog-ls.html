{{ define "dialog-ls" }}
<dialog id='moDialog'>
    <p id='moDialogMessage'></p>
    <form method='dialog'>
        <button type='submit' class='display-none' id='moDialogYes'>{{ .T "Yes" }}</button>
        <button type='submit' class='display-none' id='moDialogCancel'>{{ .T "Cancel" }}</button>
        <button type='submit' class='display-none' id='moDialogClose'>{{ .T "Close" }}</button>
    </form>
</dialog>
{{ end }}
